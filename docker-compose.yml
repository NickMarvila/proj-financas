version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: financas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-financasponto}
      POSTGRES_USER: ${DB_USER:-financas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-financas123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-financas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-api:
    image: atendai/evolution-api:v2.2.3
    container_name: financas-evolution
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SERVER_URL: http://localhost:8081
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-financas-secret-key}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      LOG_LEVEL: ERROR
      DEL_INSTANCE: "false"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: "postgresql"
      DATABASE_CONNECTION_URI: "postgres://${DB_USER:-financas}:${DB_PASSWORD:-financas123}@postgres:5432/${DB_NAME:-financasponto}?schema=evolution"
      REDIS_ENABLED: "false"
      RABBITMQ_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financas-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-financasponto}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-financas}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-financas123}
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-financas-secret-key}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-financasponto}
      WHATSAPP_PHONE: ${WHATSAPP_PHONE:-5524999856230}
      GMAIL_USER: ${GMAIL_USER:-nickmarvila@gmail.com}
      TOKENS_DIR: /app/tokens
      CREDENTIALS_PATH: /app/credentials/credentials.json
    volumes:
      - ./gmail-tokens:/app/tokens
      - ./gmail-credentials:/app/credentials
    depends_on:
      postgres:
        condition: service_healthy
      evolution-api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: financas-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  evolution_instances:
  evolution_store:
